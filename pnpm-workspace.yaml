packages:
  - packages/*
  - templates/*
  - nextjs
  - examples
  - guide
  - website
  - app

allowBuilds:
  "@clerk/shared": false
  core-js: false
  esbuild: true
  # Lefthook installs the Git hooks from its postinstall script.
  lefthook: true
  msw: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "next@16.3.8"
  - "@next/env@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - rolldown-plugin-react-forward-ref@0.2.0
  - "@visonaut/playwright"
  - visonaut

overrides:
  "@ariakit/components": "workspace:*"
  "@ariakit/react": "workspace:*"
  "@ariakit/react-components": "workspace:*"
  "@ariakit/react-store": "workspace:*"
  "@ariakit/react-utils": "workspace:*"
  "@ariakit/solid": "workspace:*"
  "@ariakit/solid-components": "workspace:*"
  "@ariakit/solid-store": "workspace:*"
  "@ariakit/solid-utils": "workspace:*"
  "@ariakit/store": "workspace:*"
  "@ariakit/tailwind": "workspace:*"
  "@ariakit/test": "workspace:*"
  "@ariakit/utils": "workspace:*"

patchedDependencies:
  "@changesets/apply-release-plan@8.1.1": patches/@changesets__apply-release-plan@8.1.1.patch

peerDependencyRules:
  allowedVersions:
    "@clerk/astro>astro": "7"
    react: "19"
    react-dom: "19"

saveExact: true
