packages:
  - packages/*
  - templates/*
  - nextjs
  - examples
  - guide
  - website
  - app

allowBuilds:
  "@clerk/shared": false
  core-js: false
  esbuild: true
  # Lefthook installs the Git hooks from its postinstall script.
  lefthook: true
  msw: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - rolldown-plugin-react-forward-ref@0.2.0
  - "@visonaut/playwright"
  - visonaut
  - "@solidjs/babel-plugin@2.0.0-rc.13"
  - "@solidjs/compiler-darwin-arm64@2.0.0-rc.13"
  - "@solidjs/compiler-darwin-x64@2.0.0-rc.13"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0-rc.13"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0-rc.13"
  - "@solidjs/compiler-wasm32-wasi@2.0.0-rc.13"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0-rc.13"
  - "@solidjs/compiler@2.0.0-rc.13"
  - "@solidjs/signals@2.0.0-rc.13"
  - "@solidjs/vite-plugin@3.0.0-next.47"
  - "@solidjs/web@2.0.0-rc.13"
  - solid-js@2.0.0-rc.13

overrides:
  "@ariakit/components": "workspace:*"
  "@ariakit/react": "workspace:*"
  "@ariakit/react-components": "workspace:*"
  "@ariakit/react-store": "workspace:*"
  "@ariakit/react-utils": "workspace:*"
  "@ariakit/solid": "workspace:*"
  "@ariakit/solid-components": "workspace:*"
  "@ariakit/solid-store": "workspace:*"
  "@ariakit/solid-utils": "workspace:*"
  "@ariakit/store": "workspace:*"
  "@ariakit/tailwind": "workspace:*"
  "@ariakit/test": "workspace:*"
  "@ariakit/utils": "workspace:*"

patchedDependencies:
  "@changesets/apply-release-plan@8.1.1": patches/@changesets__apply-release-plan@8.1.1.patch

peerDependencyRules:
  allowedVersions:
    "@clerk/astro>astro": "7"
    react: "19"
    react-dom: "19"

saveExact: true
