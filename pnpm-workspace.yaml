packages:
  - packages/*
  - templates/*
  - nextjs
  - examples
  - guide
  - website
  - app

allowBuilds:
  "@clerk/shared": false
  core-js: false
  esbuild: true
  # Lefthook installs the Git hooks from its postinstall script.
  lefthook: true
  msw: false
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - clava@0.7.2
  - rolldown-plugin-react-forward-ref@0.2.0
  - "@visonaut/playwright"
  - visonaut

overrides:
  "@ariakit/components": "workspace:*"
  "@ariakit/react": "workspace:*"
  "@ariakit/react-components": "workspace:*"
  "@ariakit/react-store": "workspace:*"
  "@ariakit/react-utils": "workspace:*"
  "@ariakit/solid": "workspace:*"
  "@ariakit/solid-components": "workspace:*"
  "@ariakit/solid-store": "workspace:*"
  "@ariakit/solid-utils": "workspace:*"
  "@ariakit/store": "workspace:*"
  "@ariakit/tailwind": "workspace:*"
  "@ariakit/test": "workspace:*"
  "@ariakit/utils": "workspace:*"

packageExtensions:
  # @astrojs/astro2tsx loads @napi-rs/wasm-runtime without declaring the
  # @emnapi/runtime peer, so pnpm resolves it to the highest version in the
  # graph. Rolldown 1.3 adds @emnapi/runtime 2.0 beta, which crashes against
  # the @emnapi/core 1.x that astro2tsx pins. Remove this extension once
  # https://github.com/withastro/compiler-rs/issues/214 is fixed.
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": "1.11.3"

patchedDependencies:
  "@changesets/apply-release-plan@8.1.1": patches/@changesets__apply-release-plan@8.1.1.patch
  # Cache Components renders hang or lose content on workerd without
  # https://github.com/opennextjs/opennextjs-cloudflare/pull/1318. The patch
  # applies that PR's compiled output to the published dist. Remove it once a
  # released @opennextjs/cloudflare version includes the PR. Until then, port
  # the patch to each new adapter version.
  "@opennextjs/cloudflare@1.20.16": patches/@opennextjs__cloudflare@1.20.16.patch

peerDependencyRules:
  allowedVersions:
    "@clerk/astro>astro": "7"
    react: "19"
    react-dom: "19"

saveExact: true

tasks:
  check:
    dependsOn:
      - wrangler-types
  clean:
    dependsOn: []
  dev:
    dependsOn: []
  docs:
    dependsOn: []
  preview:
    dependsOn: []
