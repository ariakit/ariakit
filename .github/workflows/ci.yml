name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      main: ${{ steps.plan.outputs.main }}
      app: ${{ steps.plan.outputs.app }}
      perf: ${{ steps.plan.outputs.perf }}
      plus: ${{ steps.plan.outputs.plus }}
      release_preview: ${{ steps.plan.outputs.release_preview }}
      docs: ${{ steps.plan.outputs.docs }}
      og_images: ${{ steps.plan.outputs.og_images }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout event history
        id: event-history
        background: true
        uses: actions/checkout@v7
        with:
          path: .visonaut-event
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted planner
        uses: actions/checkout@v7
        with:
          ref: c87988effdff42edf4934ded906aa32ee3c04b66
          path: .visonaut-planner
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .visonaut-planner/package.json

      - name: Wait for event history
        wait: event-history

      - name: Plan CI
        id: plan
        working-directory: .visonaut-event
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            node ../.visonaut-planner/packages/ariakit-scripts/src/ci-run.ts plan
          fi

      - name: Submit without visual tests
        if: steps.plan.outputs.app == 'false'
        env:
          VISONAUT_SERVER: https://visonaut.com
        run: npm exec --yes --ignore-scripts --package=visonaut@0.6.0 -- visonaut submit --no-visual

  main:
    name: Main
    needs: plan
    if: needs.plan.outputs.main == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/main.yml
    secrets: inherit

  app:
    name: App
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.app == 'true'
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
      statuses: write
    uses: ./.github/workflows/app.yml
    secrets: inherit

  perf:
    name: Performance
    needs: plan
    if: needs.plan.outputs.perf == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/perf.yml
    secrets: inherit

  plus:
    name: Plus
    needs: plan
    if: needs.plan.outputs.plus == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/plus.yml
    secrets: inherit

  release_preview:
    name: Release preview
    needs: plan
    if: needs.plan.outputs.release_preview == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-preview.yml
    secrets: inherit

  docs:
    name: Docs
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  og_images:
    name: OG images
    needs: plan
    if: needs.plan.outputs.og_images == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/og-images.yml
    secrets: inherit

  gate:
    name: Gate
    if: always() && github.event_name != 'push'
    needs:
      - plan
      - main
      - app
      - perf
      - plus
      - release_preview
      - docs
      - og_images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Verify CI results
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node packages/ariakit-scripts/src/ci-run.ts gate
