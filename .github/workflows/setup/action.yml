name: setup
description: Set up environment

inputs:
  filters:
    description: Newline-separated pnpm package filters
    required: false
  install:
    description: Whether to install dependencies
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      with:
        version: 12.0.0-alpha.21
        package_json_file: pnpm-workspace.yaml
        standalone: true

    - name: Keep pnpm version
      shell: bash
      run: echo "pnpm_config_manage_package_manager_versions=false" >> "$GITHUB_ENV"

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json

    - name: Allow partial install
      if: inputs.filters != '' || inputs.install != 'true'
      shell: bash
      # pnpm otherwise repairs the intentionally partial workspace with an
      # unfiltered install before the next run or exec command.
      run: echo "pnpm_config_verify_deps_before_run=false" >> "$GITHUB_ENV"

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        FILTERS: ${{ inputs.filters }}
      run: |
        args=(--frozen-lockfile --no-runtime)
        while IFS= read -r filter; do
          if [ -n "$filter" ]; then
            if [ -z "$(pnpm --filter "$filter" list --depth=-1 --parseable)" ]; then
              echo "::error::No projects matched filter: $filter"
              exit 1
            fi
            args+=(--filter "$filter")
          fi
        done <<< "$FILTERS"
        if ! pnpm install "${args[@]}"; then
          echo "::warning::pnpm install failed; retrying once"
          pnpm install "${args[@]}"
        fi
