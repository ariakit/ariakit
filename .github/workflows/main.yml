name: main

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Sync Astro types
        # `pnpm run lint` is type-aware and `app/.astro` is gitignored, so
        # without this step `astro:content` resolves `CollectionEntry` to `any`
        # and CI lints a weaker type graph than a synced checkout.
        run: pnpm --fail-if-no-match -F app exec astro sync

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint-css

  typescript:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Type check
        run: pnpm run tsc -v

  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: ./packages/*...

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Test
        run: pnpm test

  test-react18:
    name: Test React 18
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Test
        run: pnpm test-react18

  website:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: website...

      - name: Build website
        run: pnpm run build-website-lite
