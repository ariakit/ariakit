name: main

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: root

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint-css

  typescript:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            root...
            app...
            website...
            ./templates/*...

      - name: Type check
        run: pnpm run tsc -v

  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: root...

      - name: Build
        run: pnpm run build

  test:
    name: "Test${{ matrix.name && format(' {0}', matrix.name) || '' }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: test
            filters: |
              root...
              app...
              website...
          - name: React
            script: test-react
            filters: |
              root...
              app...
          # Runs unsharded on happy-dom (fast). The Test step still honors a
          # `shard:` key, so split it again by re-adding `shard: "1/2"` and
          # `shard: "2/2"` entries here if it ever slows down.
          - name: React 18
            script: test-react18
            filters: root...
          - name: Solid
            script: test-solid
            filters: |
              root...
              app...

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: ${{ matrix.filters }}

      - name: Test
        env:
          TEST_SCRIPT: ${{ matrix.script }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$TEST_SHARD" ]; then
            pnpm "$TEST_SCRIPT" --shard "$TEST_SHARD"
          else
            pnpm "$TEST_SCRIPT"
          fi

  website:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: website...

      - name: Build website
        env:
          DISABLE_SHIKI: "true"
        run: pnpm -F website run build
