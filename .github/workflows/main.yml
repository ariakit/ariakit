name: main

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Lint
        run: pnpm run lint

      - name: Lint CSS
        run: pnpm run lint-css

  typescript:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Type check
        run: pnpm run tsc -v

  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: ./packages/*...

      - name: Build
        run: pnpm run build

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Test
        run: >-
          pnpm test
          --project node
          --project dom
          --project react
          --project solid

  test-vitest-browser:
    name: Browser Mode (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            browser: chrome
            test: >-
              xvfb-run pnpm test
              --project '*-chrome'
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            browser: firefox
            test: >-
              xvfb-run pnpm test
              --project '*-firefox'
          - os: macos-latest
            name: Safari
            engine: webkit
            browser: safari
            test: >-
              pnpm test
              --project '*-safari'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engine }}
          workspace: root

      - name: Test
        id: test
        run: ${{ matrix.test }}

      - name: Upload test results
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-browser-${{ matrix.browser }}-test-results
          path: test-results
          retention-days: 7

  test-react18:
    name: Test React 18
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup

      - name: Test
        run: pnpm test-react18

  website:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: website...

      - name: Build website
        run: pnpm run build-website-lite
