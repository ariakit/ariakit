name: Visonaut capture

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: capture

permissions:
  contents: read

env:
  LEFTHOOK: "0"
  pnpm_config_verify_deps_before_run: "false"

jobs:
  build:
    if: inputs.mode == 'capture'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile --no-runtime --filter app...
      - name: Build the candidate apps
        run: pnpm run build-app
        env:
          CLOUDFLARE_ENV: preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visonaut-candidate-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
            nextjs/.open-next
          overwrite: true
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  render:
    name: ${{ matrix.browser }}
    needs: build
    if: always() && (inputs.mode == 'probe' || needs.build.result == 'success')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-24.04
          - browser: firefox
            os: ubuntu-24.04
          - browser: webkit
            os: macos-15
    env:
      VISONAUT_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Set isolated executor paths
        run: |
          echo "VISONAUT_EXECUTOR_DIRECTORY=$RUNNER_TEMP/visonaut-executor" >> "$GITHUB_ENV"
          echo "VISONAUT_TRUSTED_PLAN=$RUNNER_TEMP/visonaut-plan.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # job.workflow_sha is the reviewed reusable workflow commit, not the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .visonaut-trusted
          sparse-checkout: |
            .github/visonaut
            .github/visonaut-plan.json
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Install the reviewed public executor
        run: |
          rm -rf "$VISONAUT_EXECUTOR_DIRECTORY" app/.visonaut-results
          mkdir -p "$VISONAUT_EXECUTOR_DIRECTORY"
          cp -R .visonaut-trusted/.github/visonaut/. "$VISONAUT_EXECUTOR_DIRECTORY/"
          cd "$VISONAUT_EXECUTOR_DIRECTORY"
          npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - run: pnpm install --frozen-lockfile --no-runtime --filter app...
      - name: Install the fixed browser
        run: node "$VISONAUT_EXECUTOR_DIRECTORY/node_modules/playwright/cli.js" install --with-deps "$VISONAUT_BROWSER"
      - name: Measure the runner and fonts
        run: node "$VISONAUT_EXECUTOR_DIRECTORY/executor.mjs" probe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visonaut-environment-${{ matrix.browser }}-${{ github.run_attempt }}
          path: app/.visonaut-results/environment-${{ matrix.browser }}.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
      - name: Download the candidate build
        if: inputs.mode == 'capture'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: visonaut-candidate-build
      - name: Read the trusted main plan
        if: inputs.mode == 'capture'
        run: cp .visonaut-trusted/.github/visonaut-plan.json "$VISONAUT_TRUSTED_PLAN"
      - name: Prepare the unsigned render context
        if: inputs.mode == 'capture'
        run: node "$VISONAUT_EXECUTOR_DIRECTORY/executor.mjs" render-context
      - name: Run Ariakit's existing visual tests
        if: inputs.mode == 'capture'
        run: |
          cd "$VISONAUT_EXECUTOR_DIRECTORY"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run node node_modules/playwright/cli.js test --config playwright.config.mjs
          else
            node node_modules/playwright/cli.js test --config playwright.config.mjs
          fi
      - name: Encrypt the complete browser shard
        if: inputs.mode == 'capture'
        run: node "$VISONAUT_EXECUTOR_DIRECTORY/executor.mjs" encrypt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.mode == 'capture'
        with:
          name: visonaut-shard-${{ matrix.browser }}
          path: ${{ runner.temp }}/visonaut-${{ matrix.browser }}.enc
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  capture:
    name: ${{ matrix.browser }}
    needs: [build, render]
    if: always() && inputs.mode == 'capture' && needs.build.result == 'success' && needs.render.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VISONAUT_BROWSER: ${{ matrix.browser }}
      VISONAUT_SERVER: https://preview.visonaut.com
    steps:
      - name: Set isolated executor path
        run: echo "VISONAUT_EXECUTOR_DIRECTORY=$RUNNER_TEMP/visonaut-executor" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .visonaut-trusted
          sparse-checkout: .github/visonaut
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - name: Install the reviewed public executor
        run: |
          mkdir -p "$VISONAUT_EXECUTOR_DIRECTORY"
          cp -R .visonaut-trusted/.github/visonaut/. "$VISONAUT_EXECUTOR_DIRECTORY/"
          cd "$VISONAUT_EXECUTOR_DIRECTORY"
          npm ci --ignore-scripts --no-audit --no-fund --workspaces=false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: visonaut-shard-${{ matrix.browser }}
          path: ${{ runner.temp }}/visonaut-transfer
      - name: Redeem the one-use key and bind the signed upload job
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$VISONAUT_EXECUTOR_DIRECTORY/executor.mjs" submit
      - name: Upload and finalize the shard
        run: |
          node "$VISONAUT_EXECUTOR_DIRECTORY/node_modules/visonaut/dist/bin.js" upload --manifest app/.visonaut-results/manifest.json
          node "$VISONAUT_EXECUTOR_DIRECTORY/node_modules/visonaut/dist/bin.js" finalize --manifest app/.visonaut-results/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: app/.visonaut-results/receipt.json
          overwrite: false
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
