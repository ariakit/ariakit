name: Visonaut diagnostic

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: read
  # GitHub validates the skipped capture job too; running probe jobs remove OIDC.
  id-token: write

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/visonaut-trusted-prep' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/visonaut-capture.yml
    with:
      mode: probe
