name: app

on:
  workflow_call:
    inputs:
      plan:
        type: boolean
        default: false
    outputs:
      main:
        value: ${{ jobs.plan.outputs.main }}
      app:
        value: ${{ jobs.plan.outputs.app }}
      perf:
        value: ${{ jobs.plan.outputs.perf }}
      plus:
        value: ${{ jobs.plan.outputs.plus }}
      release_preview:
        value: ${{ jobs.plan.outputs.release_preview }}
      docs:
        value: ${{ jobs.plan.outputs.docs }}
      og_images:
        value: ${{ jobs.plan.outputs.og_images }}
      plan:
        value: ${{ jobs.plan.outputs.plan }}

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com
  VISONAUT_PACKAGE_SHA256: 7e8c77bf386518619fd2a04a8b5a1509fa5a1db1c2a84827b26132672999d3a5

jobs:
  plan:
    name: Plan
    if: inputs.plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main: ${{ steps.plan.outputs.main }}
      app: ${{ steps.plan.outputs.app }}
      perf: ${{ steps.plan.outputs.perf }}
      plus: ${{ steps.plan.outputs.plus }}
      release_preview: ${{ steps.plan.outputs.release_preview }}
      docs: ${{ steps.plan.outputs.docs }}
      og_images: ${{ steps.plan.outputs.og_images }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout event history
        uses: actions/checkout@v7
        with:
          path: .visonaut-event
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted planner
        uses: actions/checkout@v7
        with:
          ref: c87988effdff42edf4934ded906aa32ee3c04b66
          path: .visonaut-planner
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .visonaut-planner/package.json

      - name: Plan CI
        id: plan
        working-directory: .visonaut-event
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            node ../.visonaut-planner/packages/ariakit-scripts/src/ci-run.ts plan
          fi

  report:
    name: Report
    if: inputs.plan
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Report successful Plan
        env:
          VISUAL_REQUIRED: ${{ needs.plan.outputs.app }}
        run: |
          node --input-type=module <<'NODE'
          const required = process.env.VISUAL_REQUIRED;
          if (required !== "true" && required !== "false") {
            throw new Error("Plan must report an explicit app result.");
          }
          const origin = process.env.VISONAUT_SERVER;
          const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          identityUrl.searchParams.set("audience", `${origin}/plan-report`);
          const identityResponse = await fetch(identityUrl, {
            headers: {
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
            redirect: "error",
            signal: AbortSignal.timeout(30_000),
          });
          if (!identityResponse.ok) {
            throw new Error(`Plan identity is unavailable (HTTP ${identityResponse.status}).`);
          }
          const identity = await identityResponse.json();
          if (typeof identity.value !== "string" || !identity.value) {
            throw new Error("Plan identity is invalid.");
          }
          const response = await fetch(`${origin}/v1/plan`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${identity.value}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              schemaVersion: 1,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              testedSha: process.env.GITHUB_SHA,
              planResult: "success",
              visualRequired: required === "true",
            }),
            redirect: "error",
            signal: AbortSignal.timeout(30_000),
          });
          await response.body?.cancel();
          if (response.status !== 204) {
            throw new Error(`Plan report failed (HTTP ${response.status}).`);
          }
          NODE

  build:
    name: Build app
    if: ${{ !inputs.plan }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    if: ${{ !inputs.plan }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build-worker

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Android
            engine: chromium
            project: android
            test: xvfb-run pnpm -F app run test
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [1, 2]
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [2, 2]
          - os: macos-latest
            name: iOS
            engine: webkit
            project: ios
            test: pnpm -F app run test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engine }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test
        id: test
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.project }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual capture / ${{ matrix.shard }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: linux
            engines: chromium firefox
            projects: chrome firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            shard: safari
            engines: webkit
            projects: safari
            test: pnpm -F app run test-visual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engines }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test visual
        run: ${{ matrix.test }} --project ${{ matrix.projects }} --grep @visual --output test-results/test-visual

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: visonaut-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual / Submit
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_WORKFLOW_SOURCE_SHA: ${{ vars.VISONAUT_WORKFLOW_SOURCE_SHA }}
      VISONAUT_CAPTURE_JOB_PREFIX: "App / Visual capture / "
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual / Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: c87988effdff42edf4934ded906aa32ee3c04b66
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@0.4.0"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard linux --shard safari

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    if: ${{ always() && !inputs.plan && github.event_name != 'merge_group' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
