name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    # Experiment: run the Safari project on Linux WebKit only, with repeated
    # runs and no retries to collect flake evidence and per-test durations.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux WebKit
            engine: webkit
            project: safari
            test: xvfb-run pnpm -F app run test
            shard: [1, 3]
          - os: ubuntu-latest
            name: Linux WebKit
            engine: webkit
            project: safari
            test: xvfb-run pnpm -F app run test
            shard: [2, 3]
          - os: ubuntu-latest
            name: Linux WebKit
            engine: webkit
            project: safari
            test: xvfb-run pnpm -F app run test
            shard: [3, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test
        id: test
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/webkit-report/report.json
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual --retries=0 --repeat-each=2 --reporter=dot,json ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webkit-report-${{ github.run_attempt }}-${{ join(matrix.shard, '-') }}
          path: ${{ runner.temp }}/webkit-report
          retention-days: 7

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.project }}-${{ github.run_attempt }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual Capture (${{ matrix.shard }})
    # Experiment: no visual capture or submission.
    if: false
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: linux
            engines: chromium firefox
            projects: chrome firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            shard: safari
            engines: webkit
            projects: safari
            test: pnpm -F app run test-visual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engines }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test visual
        run: ${{ matrix.test }} --project ${{ matrix.projects }} --grep @visual --output test-results/test-visual

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: visonaut-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual Submit
    # Experiment: no visual capture or submission.
    if: false
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_CAPTURE_JOB_NAME: "App / Visual Capture ({shard})"
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          version="$(jq -er '.devDependencies.visonaut' package.json)"
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@$version"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard linux --shard safari

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    # Experiment: no preview deployment.
    if: false
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
