name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome android
            test: xvfb-run pnpm -F app run test
            shard: [1, 2]
            shardWeights: "3:4"
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome android
            test: xvfb-run pnpm -F app run test
            shard: [2, 2]
            shardWeights: "3:4"
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
            shard: [1, 2]
            shardWeights: "4:5"
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
            shard: [2, 2]
            shardWeights: "4:5"
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari ios
            test: pnpm -F app run test
            shard: [1, 2]
            shardWeights: "3:5"
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari ios
            test: pnpm -F app run test
            shard: [2, 2]
            shardWeights: "3:5"
    steps:
      # Spotlight indexes the checkout and the `pnpm install` files on the macOS
      # runners and adds CPU load. See https://github.com/ariakit/ariakit/pull/7937
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo mdutil -a -i off
          mdutil -sa

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test
        id: test
        env:
          # Playwright splits shards by test count, so the shards finish at
          # different times. PWTEST_SHARD_WEIGHTS (not in the Playwright docs,
          # one integer per shard) changes the split, for example 3:5 gives
          # shard 1 3/8 of the tests instead of 1/2. The weights come from the
          # per-test durations of 4 runs. Safari 5:7 had a median gap of
          # 3.6m between its shards (shard 1 slower in 3 of 4), and 3:5
          # simulates to a gap of 0.3m. Chrome 3:4 and Firefox 4:5 are
          # already within 0.5m.
          PWTEST_SHARD_WEIGHTS: ${{ matrix.shardWeights }}
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual Capture (${{ matrix.shard }})
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: chrome
            project: chrome
            engine: chromium
            test: xvfb-run pnpm -F app run test-visual
          - os: ubuntu-latest
            shard: firefox
            project: firefox
            engine: firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            shard: safari-1
            project: safari
            playwrightShard: 1/2
            shardWeights: "3:2"
            engine: webkit
            test: pnpm -F app run test-visual
          - os: macos-latest
            shard: safari-2
            project: safari
            playwrightShard: 2/2
            shardWeights: "3:2"
            engine: webkit
            test: pnpm -F app run test-visual
    steps:
      # Spotlight indexes the checkout and the `pnpm install` files on the macOS
      # runners and adds CPU load. See https://github.com/ariakit/ariakit/pull/7937
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo mdutil -a -i off
          mdutil -sa

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      # The capture of the base commit lets the adapter accept a first
      # screenshot that has a known image digest. The digests are only hints,
      # so this step never fails the job. Only main push runs are sources.
      # See https://github.com/ariakit/visonaut/pull/565
      - name: Download previous capture
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHARD: ${{ matrix.shard }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set +e
          find_run() {
            gh run list --repo "$REPOSITORY" --workflow ci.yml --branch main \
              --event push "$@" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty'
          }
          # The artifact name has the run attempt. Take the newest one that
          # has not expired.
          find_artifact() {
            gh api "repos/$REPOSITORY/actions/runs/$1/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.expired | not) | select(.name | test(\"^visonaut-capture-[0-9]+-[0-9]+-($SHARD|${SHARD%-[0-9]})\$\"))] | sort_by(.created_at) | last | .name // empty"
          }
          # A newer push to main often cancels the run of the base commit. Its
          # capture artifact is still usable, because a shard uploads it only
          # after its visual tests pass.
          base_run=""
          if [ -n "$BASE_SHA" ]; then
            base_run="$(find_run --commit "$BASE_SHA" --status completed)"
          fi
          directory="$RUNNER_TEMP/visonaut-previous"
          for run in "$base_run" "$(find_run --status success)"; do
            [ -n "$run" ] || continue
            artifact="$(find_artifact "$run")"
            [ -n "$artifact" ] || continue
            rm -rf "$directory"
            if gh run download "$run" --repo "$REPOSITORY" --name "$artifact" --dir "$directory" &&
              [ -f "$directory/manifest.json" ]; then
              echo "VISONAUT_PREVIOUS_CAPTURE=$directory" >> "$GITHUB_ENV"
              echo "Previous capture: run $run, artifact $artifact"
              exit 0
            fi
          done
          echo "Previous capture: none found"
          exit 0

      - name: Test visual
        env:
          VISUAL_SHARD: ${{ matrix.shard }}
          VISUAL_PROJECT: ${{ matrix.project }}
          VISUAL_PLAYWRIGHT_SHARD: ${{ matrix.playwrightShard }}
          # The first tests of the Safari project are faster than the last ones.
          # In the per-test durations of 3 runs, 3:2 simulates to a gap of 7 to
          # 24s between the shards, and 1:1 to a gap of 102 to 136s.
          PWTEST_SHARD_WEIGHTS: ${{ matrix.shardWeights }}
        # The invocation must match discovery.expectedInvocation in
        # app/playwright.config.ts exactly.
        run: ${{ matrix.test }} --project ${{ matrix.project }} --grep @visual --output test-results/test-visual ${{ matrix.playwrightShard && format('--shard={0}', matrix.playwrightShard) || '' }}

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: visonaut-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          # Pull requests download the capture of their base commit, which can
          # be older than one day.
          retention-days: ${{ github.event_name == 'push' && 7 || 1 }}

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ matrix.shard }}-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual Submit
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_CAPTURE_JOB_NAME: "App / Visual Capture ({shard})"
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          version="$(jq -er '.devDependencies.visonaut' package.json)"
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@$version"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard chrome --shard firefox --shard safari-1 --shard safari-2

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    if: ${{ always() && github.event_name != 'merge_group' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
