name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build-worker

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Android
            engine: chromium
            project: android
            test: xvfb-run pnpm -F app run test
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [1, 2]
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [2, 2]
          - os: macos-latest
            name: iOS
            engine: webkit
            project: ios
            test: pnpm -F app run test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engine }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test
        id: test
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.project }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: ${{ matrix.name }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Visual
            engines: chromium firefox
            projects: chrome firefox
            test: xvfb-run pnpm -F app exec playwright test
            shard: linux
          - os: macos-latest
            name: Visual (Safari)
            engines: webkit
            projects: safari
            test: pnpm -F app exec playwright test
            shard: safari
    env:
      VISUAL_TEST: "true"
      VISONAUT_SHARD: ${{ matrix.shard }}
      VISONAUT_PACKAGE_SHA256: bab64dabc7998022d860e778a85dccba67d2fb30ad6f5496209ce8ec4f734984
      VISONAUT_COMPARISON_POLICY_DIGEST: 395f2b596a2e9cf4f8ce86b8643c48856f326773becf337cee6e66faba289249
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/workflows/setup
        with:
          filters: app...
      - uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engines }}
          workspace: app
      - uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app
      - uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next
      - name: Test visual
        run: ${{ matrix.test }} --project ${{ matrix.projects }} --grep @visual --output test-results/test-visual
      - name: Encrypt captures
        run: pnpm -F app exec visonaut pack --dir "$RUNNER_TEMP/visonaut-$VISONAUT_SHARD" --output "$RUNNER_TEMP/visonaut-$VISONAUT_SHARD.enc"
      - uses: actions/upload-artifact@v7
        with:
          name: visonaut-transfer-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut-${{ matrix.shard }}.enc
          if-no-files-found: error
          retention-days: 1
      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: upload / ${{ matrix.shard }}
    needs: visual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: linux
            browser: chromium
          - os: macos-latest
            shard: safari
            browser: webkit
    env:
      VISONAUT_WORKFLOW_SOURCE_SHA: ${{ vars.VISONAUT_WORKFLOW_SOURCE_SHA }}
      VISONAUT_SHARD: ${{ matrix.shard }}
      VISONAUT_PACKAGE_SHA256: bab64dabc7998022d860e778a85dccba67d2fb30ad6f5496209ce8ec4f734984
      VISONAUT_CLI_SHA256: 18cc35a0f1198b1e77ed18d844941cdf0e9acc12f20b0d98b54e406a0f11105b
      VISONAUT_COMPARISON_POLICY_DIGEST: 395f2b596a2e9cf4f8ce86b8643c48856f326773becf337cee6e66faba289249
      VISONAUT_FONT_PACKAGE: "@fontsource-variable/inter"
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - &install_visonaut
        name: Install verified Visonaut CLI
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            "@visonaut/playwright@0.3.0:$VISONAUT_PACKAGE_SHA256"
            "visonaut@0.3.0:$VISONAUT_CLI_SHA256"
            "@playwright/test@1.63.0:fc594f36b7b4aafece614ec6852ad728423215a76edd0a2a1821bb0c49539c4e"
            "playwright@1.63.0:195a5ee9bfed7c6e9c03965950e32e5e4dbedaa02e740e5a530eb4b87dae050c"
            "playwright-core@1.63.0:208593d4e1bcd8f8fe5f869cad1cc332dc7f1d70dc1d58c102dc3ac36e30f26c"
            "pngjs@7.0.0:c4b71873d48a692dd5eeb1dcb62185c7aafe40f2180c7cc7f30ec71e89a080be"
          )
          archives=()
          for entry in "${packages[@]}"; do
            archive="$(cd "$RUNNER_TEMP" && npm pack "${entry%%:*}" --silent)"
            actual="$(shasum -a 256 "$RUNNER_TEMP/$archive" | cut -d ' ' -f 1)"
            test "$actual" = "${entry#*:}"
            archives+=("$RUNNER_TEMP/$archive")
          done
          npm install --prefix "$RUNNER_TEMP/visonaut-tools" --offline --ignore-scripts --no-audit --no-fund "${archives[@]}"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Match visual job fonts
        run: playwright install-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: visonaut-transfer-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut-transfer
      - name: Upload captures
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut upload --bundle "$RUNNER_TEMP/visonaut-transfer/visonaut-$VISONAUT_SHARD.enc"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.upload.outputs.name }}
          path: ${{ runner.temp }}/visonaut-upload-${{ matrix.shard }}/receipt.json
          if-no-files-found: error
          retention-days: 7

  submit:
    name: submit
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    env:
      VISONAUT_PACKAGE_SHA256: bab64dabc7998022d860e778a85dccba67d2fb30ad6f5496209ce8ec4f734984
      VISONAUT_CLI_SHA256: 18cc35a0f1198b1e77ed18d844941cdf0e9acc12f20b0d98b54e406a0f11105b
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - *install_visonaut
      - run: visonaut submit --run "$GITHUB_RUN_ID"

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
