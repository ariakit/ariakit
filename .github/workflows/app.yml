name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Spotlight ${{ matrix.spotlight }} ${{ matrix.pair }}
    needs: [build, build-nextjs]
    runs-on: macos-latest
    timeout-minutes: 120
    # Experiment: compare Spotlight indexing on and off on macOS for the Safari
    # test shards and the Safari visual capture, and sample memory per process
    # group during the Test step. The on and off jobs of each pair are queued
    # next to each other, and the organization allows only 5 macOS jobs at a
    # time.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pair: [shard-1, visual-1, shard-2, visual-2]
        spotlight: ["on", "off"]
        include:
          - pair: shard-1
            filters: app...
            test: pnpm -F app run test --project safari ios --pass-with-no-tests --grep-invert @visual --shard=1/2
            shardWeights: "5:7"
          - pair: shard-2
            filters: app...
            test: pnpm -F app run test --project safari ios --pass-with-no-tests --grep-invert @visual --shard=2/2
            shardWeights: "5:7"
          - pair: visual-1
            filters: |
              app...
              root
            test: pnpm -F app run test-visual --project safari --grep @visual --output test-results/test-visual
            visualShard: safari
          - pair: visual-2
            filters: |
              app...
              root
            test: pnpm -F app run test-visual --project safari --grep @visual --output test-results/test-visual
            visualShard: safari
    steps:
      # Spotlight indexes the files that the checkout and the install create,
      # so the off variant disables it before them.
      - name: Record runner and set Spotlight
        env:
          SPOTLIGHT: ${{ matrix.spotlight }}
        run: |
          echo "image: $ImageOS $ImageVersion"
          echo "runner: $RUNNER_NAME"
          echo "host: $(hostname)"
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          # The workspace is on /System/Volumes/Data, which can differ from /.
          echo "Spotlight before:"
          mdutil -s / || true
          mdutil -sa || true
          if [ "$SPOTLIGHT" = "off" ]; then
            sudo mdutil -a -i off || echo "mdutil exited with $?"
          fi
          echo "Spotlight after:"
          mdutil -s / || true
          mdutil -sa || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: ${{ matrix.filters }}

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: webkit
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test
        id: test
        env:
          PWTEST_SHARD_WEIGHTS: ${{ matrix.shardWeights }}
          VISUAL_SHARD: ${{ matrix.visualShard }}
        run: |
          bash .github/experiment/sample-memory.sh > "$RUNNER_TEMP/memory.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          ${{ matrix.test }}

      - name: Print memory samples
        if: always()
        run: |
          echo "Spotlight at the end:"
          mdutil -s / || true
          mdutil -sa || true
          cat "$RUNNER_TEMP/memory.log"

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-spotlight-${{ matrix.spotlight }}-${{ matrix.pair }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual Capture (${{ matrix.shard }})
    # Experiment: the test job runs the Safari visual capture.
    if: false
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: chrome
            engine: chromium
            test: xvfb-run pnpm -F app run test-visual
          - os: ubuntu-latest
            shard: firefox
            engine: firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            shard: safari
            engine: webkit
            test: pnpm -F app run test-visual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test visual
        env:
          VISUAL_SHARD: ${{ matrix.shard }}
        run: ${{ matrix.test }} --project ${{ matrix.shard }} --grep @visual --output test-results/test-visual

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: visonaut-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ matrix.shard }}-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual Submit
    # Experiment: no visual submission.
    if: false
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_CAPTURE_JOB_NAME: "App / Visual Capture ({shard})"
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          version="$(jq -er '.devDependencies.visonaut' package.json)"
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@$version"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard chrome --shard firefox --shard safari

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    # Experiment: no preview deployment.
    if: false
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
