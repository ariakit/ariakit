name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com
  VISONAUT_PACKAGE_SHA256: 7e8c77bf386518619fd2a04a8b5a1509fa5a1db1c2a84827b26132672999d3a5

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build-worker

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Android
            engine: chromium
            project: android
            test: xvfb-run pnpm -F app run test
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [1, 2]
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
            shard: [2, 2]
          - os: macos-latest
            name: iOS
            engine: webkit
            project: ios
            test: pnpm -F app run test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engine }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test
        id: test
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.project }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual Capture (${{ matrix.shard }})
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: linux
            engines: chromium firefox
            projects: chrome firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            shard: safari
            engines: webkit
            projects: safari
            test: pnpm -F app run test-visual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engines }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test visual
        run: ${{ matrix.test }} --project ${{ matrix.projects }} --grep @visual --output test-results/test-visual

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: visonaut-capture-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.os }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual Submit
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_WORKFLOW_SOURCE_SHA: ${{ vars.VISONAUT_WORKFLOW_SOURCE_SHA }}
      VISONAUT_CAPTURE_JOB_NAME: "App / Visual Capture ({shard})"
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: c87988effdff42edf4934ded906aa32ee3c04b66
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@0.5.1"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard linux --shard safari

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    if: ${{ always() && github.event_name != 'merge_group' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
