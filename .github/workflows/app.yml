name: app

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build-worker

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
          - os: ubuntu-latest
            name: Android
            engine: chromium
            project: android
            test: xvfb-run pnpm -F app run test
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari
            test: pnpm -F app run test
          - os: macos-latest
            name: iOS
            engine: webkit
            project: ios
            test: pnpm -F app run test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engine }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test
        id: test
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.project }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: ${{ matrix.name }}
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Visual
            engines: chromium firefox
            projects: chrome firefox
            test: xvfb-run pnpm -F app run test-visual
          - os: macos-latest
            name: Visual (Safari)
            engines: webkit
            projects: safari
            test: pnpm -F app run test-visual
    env:
      VISUAL_PROJECTS: ${{ matrix.projects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Install Playwright
        uses: ./.github/workflows/install-playwright
        with:
          engines: ${{ matrix.engines }}
          workspace: app

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: app

      - name: Download Next.js artifact
        uses: actions/download-artifact@v8
        with:
          name: nextjs-dist
          path: nextjs/.open-next

      - name: Test visual
        id: test-visual
        # -x stops after the first failing test so we can rerun once with -u below.
        run: |
          projects=()
          for project in $VISUAL_PROJECTS; do
            projects+=(--project "$project")
          done
          ${{ matrix.test }} "${projects[@]}" --grep @visual --pass-with-no-tests -x

      - name: Update screenshots
        id: update-screenshots
        if: failure() && steps.test-visual.outcome == 'failure'
        # Record the pre-update timestamp so we can delete stale screenshots
        # that are no longer regenerated by this rerun.
        run: |
          touch -t "$(date -u -d '-1 second' '+%Y%m%d%H%M.%S' 2>/dev/null || date -u -v-1S '+%Y%m%d%H%M.%S')" "${{ runner.temp }}/pre-update-marker"
          projects=()
          for project in $VISUAL_PROJECTS; do
            projects+=(--project "$project")
          done
          ${{ matrix.test }} "${projects[@]}" --grep @visual -u

      - name: Remove stale screenshots
        if: always() && steps.update-screenshots.outcome == 'success'
        # The update run only touches files that still exist, so remove any
        # older screenshots for these browsers that were left behind.
        run: |
          for project in $VISUAL_PROJECTS; do
            find app/src -path "*/__screenshots__/*-${project}.webp" ! -newer "${{ runner.temp }}/pre-update-marker" -delete
          done

      - name: Pack screenshots
        id: pack-screenshots
        if: >
          always() &&
          (steps.test-visual.outcome == 'success' ||
          steps.update-screenshots.outcome == 'success')
        # The follow-up job applies screenshots from artifacts instead of
        # mutating the branch directly from each matrix shard.
        run: |
          mkdir -p "${{ runner.temp }}/artifacts"
          python3 <<'PY'
          import os
          import tarfile
          from pathlib import Path

          projects = os.environ["VISUAL_PROJECTS"].split()
          root = Path("app/src")
          artifacts = Path(os.environ["RUNNER_TEMP"]) / "artifacts"
          for project in projects:
              archive_path = artifacts / f"app-visual-{project}.tar.gz"
              screenshots = sorted(root.glob(f"**/__screenshots__/*-{project}.webp"))
              if not screenshots:
                  raise RuntimeError(f"No screenshots found for {project}")
              with tarfile.open(archive_path, "w:gz") as tar:
                  for screenshot in screenshots:
                      tar.add(screenshot, arcname=screenshot.as_posix())
          PY

      - name: Upload screenshots (${{ matrix.os }})
        if: always() && steps.pack-screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ matrix.os }}
          path: ${{ runner.temp }}/artifacts/app-visual-*.tar.gz
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload test results to GitHub
        if: failure() && (steps.test-visual.outcome == 'failure' || steps.update-screenshots.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.os }}
          path: app/test-results
          retention-days: 7

  visual-finalize:
    # This job intentionally assumes PRs come from branches on this repository.
    # Fork-safe write-back logic was removed with the member-only PR model.
    name: Update screenshots
    needs: visual
    if: always() && needs.visual.result != 'cancelled'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/visual.yml
    with:
      event: ${{ github.event_name }}
      visual-result: ${{ needs.visual.result }}
    secrets: inherit

  deploy-preview:
    # Preview deployments and commit statuses intentionally run only under the
    # same-repo PR model adopted by this repository.
    name: Preview
    needs: [build, build-nextjs]
    if: always()
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
