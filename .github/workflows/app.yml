name: app

on:
  workflow_call:

permissions:
  contents: read

env:
  VISONAUT_SERVER: https://visonaut.com

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Build app
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm -F app run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            app/dist
            app/.wrangler/deploy/config.json
          retention-days: 7
          include-hidden-files: true

  build-nextjs:
    name: Build Next.js app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - name: Type check Next.js app
        run: pnpm -F nextjs run tsc

      - name: Build Next.js app
        run: pnpm -F nextjs run build

      - name: Upload Next.js artifact
        uses: actions/upload-artifact@v7
        with:
          name: nextjs-dist
          path: nextjs/.open-next
          retention-days: 7
          include-hidden-files: true

  test:
    name: Test ${{ matrix.name }}${{ matrix.shard && format(' ({0})', join(matrix.shard, '/')) || '' }}
    # Experiment: only the Safari visual arms run.
    if: false
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome android
            test: xvfb-run pnpm -F app run test
            shard: [1, 2]
            shardWeights: "3:4"
          - os: ubuntu-latest
            name: Chrome
            engine: chromium
            project: chrome android
            test: xvfb-run pnpm -F app run test
            shard: [2, 2]
            shardWeights: "3:4"
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
            shard: [1, 2]
            shardWeights: "4:5"
          - os: ubuntu-latest
            name: Firefox
            engine: firefox
            project: firefox
            test: xvfb-run pnpm -F app run test
            shard: [2, 2]
            shardWeights: "4:5"
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari ios
            test: pnpm -F app run test
            shard: [1, 2]
            shardWeights: "3:5"
          - os: macos-latest
            name: Safari
            engine: webkit
            project: safari ios
            test: pnpm -F app run test
            shard: [2, 2]
            shardWeights: "3:5"
    steps:
      # Spotlight indexes the checkout and the `pnpm install` files on the macOS
      # runners and adds CPU load. See https://github.com/ariakit/ariakit/pull/7937
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo mdutil -a -i off
          mdutil -sa

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: app...

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test
        id: test
        env:
          # Playwright splits shards by test count, so the shards finish at
          # different times. PWTEST_SHARD_WEIGHTS (not in the Playwright docs,
          # one integer per shard) changes the split, for example 3:5 gives
          # shard 1 3/8 of the tests instead of 1/2. The weights come from the
          # per-test durations of 4 runs. Safari 5:7 had a median gap of
          # 3.6m between its shards (shard 1 slower in 3 of 4), and 3:5
          # simulates to a gap of 0.3m. Chrome 3:4 and Firefox 4:5 are
          # already within 0.5m.
          PWTEST_SHARD_WEIGHTS: ${{ matrix.shardWeights }}
        run: ${{ matrix.test }} --project ${{ matrix.project }} --pass-with-no-tests --grep-invert @visual ${{ matrix.shard && format('--shard={0}', join(matrix.shard, '/')) || '' }}

      - name: Upload test results to GitHub
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}${{ matrix.shard && format('-{0}', join(matrix.shard, '-')) || '' }}-test-results
          path: app/test-results
          retention-days: 7

  visual:
    name: Visual Capture (${{ matrix.arm }})
    needs: [build, build-nextjs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    # Experiment: paired Safari visual arms. Both arms of a pair start at the
    # same time, and the organization allows only 5 macOS jobs at a time.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-latest
            arm: base
            shard: safari
            engine: webkit
            test: pnpm -F app run test-visual
          - os: macos-latest
            arm: fast
            shard: safari
            engine: webkit
            test: pnpm -F app run test-visual
            fast: true
    steps:
      - name: Record runner
        run: |
          echo "image: $ImageOS $ImageVersion"
          echo "runner: $RUNNER_NAME"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true

      # Spotlight indexes the checkout and the `pnpm install` files on the macOS
      # runners and adds CPU load. See https://github.com/ariakit/ariakit/pull/7937
      - name: Turn off Spotlight indexing
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo mdutil -a -i off
          mdutil -sa

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          filters: |
            app...
            root

      - parallel:
          - name: Install Playwright
            uses: ./.github/workflows/install-playwright
            with:
              engines: ${{ matrix.engine }}
              workspace: app

          - name: Download app artifact
            uses: actions/download-artifact@v8
            with:
              name: app-build
              path: app

          - name: Download Next.js artifact
            uses: actions/download-artifact@v8
            with:
              name: nextjs-dist
              path: nextjs/.open-next

      - name: Test visual
        env:
          VISUAL_SHARD: ${{ matrix.shard }}
          VISUAL_TIMING: "true"
          VISUAL_EXPERIMENT_ARM: ${{ matrix.arm }}
          VISUAL_DEVICE_SCALE_FACTOR: ${{ matrix.scaleFactor }}
          VISUAL_FAST: ${{ matrix.fast }}
          VISUAL_PLAYWRIGHT_SHARD: ${{ matrix.playwrightShard }}
        run: ${{ matrix.test }} --project ${{ matrix.shard }} --grep @visual --output test-results/test-visual ${{ matrix.playwrightShard && format('--shard={0}', matrix.playwrightShard) || '' }}

      - name: Upload captures
        uses: actions/upload-artifact@v7
        with:
          name: experiment-capture-${{ matrix.arm }}
          path: ${{ runner.temp }}/visonaut
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results to GitHub
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-${{ matrix.arm }}-test-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7

  submit:
    name: Visual Submit
    # Experiment: no visual submission.
    if: false
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      VISONAUT_CAPTURE_JOB_NAME: "App / Visual Capture ({shard})"
      VISONAUT_SUBMIT_JOB_NAME: "App / Visual Submit"
    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/workflows/setup
        with:
          install: "false"

      - name: Install Visonaut
        run: |
          version="$(jq -er '.devDependencies.visonaut' package.json)"
          mkdir -p "$RUNNER_TEMP/visonaut-tools"
          pnpm --dir "$RUNNER_TEMP/visonaut-tools" add --ignore-scripts --save-exact "visonaut@$version"
          echo "$RUNNER_TEMP/visonaut-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Submit captures
        id: submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: visonaut submit --shard chrome --shard firefox --shard safari

      - name: Upload receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.submit.outputs.name }}
          path: ${{ steps.submit.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    # Keep PR previews and the existing main deployment; merge-queue runs only test.
    name: Preview
    needs: [build, build-nextjs]
    # Experiment: no preview deployment.
    if: false
    permissions:
      actions: read
      contents: read
      deployments: write
      statuses: write
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
