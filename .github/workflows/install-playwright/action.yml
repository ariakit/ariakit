name: install-playwright
description: Install Playwright

inputs:
  engines:
    description: Space-separated engines
    required: true
  workspace:
    description: Workspace that declares Playwright
    required: true

runs:
  using: "composite"
  steps:
    - name: Normalize Playwright engines
      id: engines
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
      run: |
        read -r -a engines <<< "$ENGINES"
        IFS=-
        printf 'cache-key=%s\n' "${engines[*]}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright
      id: cache-playwright
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || runner.os == 'Windows' && '~\\AppData\\Local\\ms-playwright' || '~/.cache/ms-playwright' }}
        # Workspaces can require different Playwright browser revisions.
        key: playwright-${{ runner.os }}-${{ inputs.workspace }}-${{ steps.engines.outputs.cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ inputs.workspace }}-${{ steps.engines.outputs.cache-key }}-
          playwright-${{ runner.os }}-${{ inputs.workspace }}-

    # Some Azure apt mirror nodes serve packages at tens of kB/s, and apt
    # doesn't fail over from a slow mirror, only from a failing one. Keep the
    # Azure mirror as the last fallback for the Playwright system dependencies.
    # TODO: Remove this step once the upstream issue is fixed:
    # https://github.com/actions/runner-images/issues/14823
    - name: Prefer the Ubuntu archive over the Azure apt mirror
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mirrors=/etc/apt/apt-mirrors.txt
        if [[ -f "$mirrors" ]]; then
          sudo sed -i -E '/^https?:\/\/azure\.archive\.ubuntu\.com\//s/priority:[0-9]+/priority:99/' "$mirrors"
          cat "$mirrors"
        fi

    - name: Install Playwright
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        read -r -a engines <<< "$ENGINES"
        pnpm --filter "$WORKSPACE" exec playwright install --with-deps "${engines[@]}"

    - name: Install Playwright system dependencies
      if: runner.os == 'Linux' && steps.cache-playwright.outputs.cache-hit == 'true'
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        read -r -a engines <<< "$ENGINES"
        pnpm --filter "$WORKSPACE" exec playwright install-deps "${engines[@]}"
