name: install-playwright
description: Install Playwright

inputs:
  engine:
    description: Engine
    required: true
  workspace:
    description: Workspace that declares Playwright
    required: true

runs:
  using: "composite"
  steps:
    - name: Cache Playwright
      id: cache-playwright
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || runner.os == 'Windows' && '~\\AppData\\Local\\ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ runner.os }}-${{ inputs.engine }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ inputs.engine }}-
          playwright-${{ runner.os }}-

    - name: Install Playwright
      if: steps.cache-playwright.outputs.cache-hit != 'true'
      shell: bash
      env:
        ENGINE: ${{ inputs.engine }}
        WORKSPACE: ${{ inputs.workspace }}
      run: pnpm --filter "$WORKSPACE" exec playwright install --with-deps "$ENGINE"
